name: Convert PDF figures to SVG

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate every figure, even if its hashes match
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pdf-to-svg-main
  cancel-in-progress: false

jobs:
  convert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Test, convert, and publish from current sources
        env:
          FORCE: ${{ inputs.force || false }}
        run: python3 -B scripts/run_figure_action.py

      - name: Summarize conversion
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('.figure-build/report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if report.exists():
                  data = json.loads(report.read_text())
                  for key in ('status', 'publication', 'attempts', 'scanned', 'converted', 'skipped', 'orphans', 'error', 'toolchain'):
                      if key in data:
                          out.write(f'**{key}**\n\n```json\n{json.dumps(data[key], indent=2)}\n```\n\n')
              else:
                  out.write('Conversion did not start. Inspect the toolchain and test steps.\n')
          PY

      - name: Preserve diagnostic files on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-to-svg-diagnostics
          path: |
            .figure-build/report.json
            .figure-build/attempt-*/.figure-build/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
