<script>
// Execute immediately upon dynamic insertion, bypassing browser lifecycle events
(function() {
    console.log("Obsidian Copy Fix: Script successfully initialized via dynamic injection.");

    document.body.addEventListener("click", async (event) => {
        // Target the copy button element
        const button = event.target.closest(".copy-code-button");
        if (!button) return;

        // Locate the code block context relative to the wrapper layout
        const parentPre = button.closest("pre") || button.closest("div") || button.parentElement;
        const codeElement = parentPre ? parentPre.querySelector("code") : null;

        if (codeElement) {
            try {
                // Execute clipboard command
                await navigator.clipboard.writeText(codeElement.innerText);
                
                // Visual response: temporary button animation
                const originalOpacity = button.style.opacity || "1";
                button.style.opacity = "0.4";
                button.style.transform = "scale(0.85)";
                
                setTimeout(() => {
                    button.style.opacity = originalOpacity;
                    button.style.transform = "scale(1)";
                }, 200);
                
            } catch (err) {
                console.error("Local clipboard write access denied: ", err);
            }
        } else {
            console.warn("Obsidian Copy Fix: Clicked button, but no matching code element was found.");
        }
    });
})();
</script>
